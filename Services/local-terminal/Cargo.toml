[package]
name = "myterm-local-terminal"
version = "0.1.0"
edition = "2021"
publish = false

[features]
production = []
release-rehearsal = ["production"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
myterm-terminal-state = { path = "../terminal-state" }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
rusqlite = "0.39"
sha2 = "0.10"
tempfile = "3"
zeroize = "1"
