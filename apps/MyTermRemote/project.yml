name: MyTermRemote
options:
  bundleIdPrefix: com.gordonbeeming.myterm
  deploymentTarget:
    iOS: "17.0"

packages:
  MyTerm:
    path: ../..
  # SwiftTerm cannot come through the local package: it is a dependency of MyTermPlatform, which
  # imports AppKit, and it is not re-exported as a product. This pin has to match the root
  # Package.resolved by hand.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0

targets:
  MyTermRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MyTermRemote
    dependencies:
      - package: MyTerm
        product: MyTermCore
      - package: MyTerm
        product: MyTermRemoteProtocol
      - package: SwiftTerm
        product: SwiftTerm
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gordonbeeming.myterm.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Info.plist below is generated from this file, so Xcode must not synthesize a second one.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        # Kept here, not only in the generated project, so regenerating with xcodegen never loses it.
        DEVELOPMENT_TEAM: AQ6HPWB3D9
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MyTerm Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.gordonbeeming.myterm.remote
            CFBundleURLSchemes: [myterm-remote]
        # Without this, iOS refuses the connection to the Mac and reports nothing useful. The
        # simulator does not enforce local network privacy, so this only shows up on a real device.
        NSLocalNetworkUsageDescription: MyTerm Remote connects to MyTerm on your Mac to show your terminals.
        NSBonjourServices:
          - _myterm-remote._tcp
        NSCameraUsageDescription: MyTerm Remote uses the camera to scan the pairing code your Mac shows.
        # Only TLS is used, which is exempt, so App Store Connect need not ask on every upload.
        ITSAppUsesNonExemptEncryption: false

  MyTermRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MyTermRemoteUITests
    dependencies:
      - target: MyTermRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gordonbeeming.myterm.remote.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: MyTermRemote
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AQ6HPWB3D9

schemes:
  MyTermRemote:
    build:
      targets:
        MyTermRemote: all
        MyTermRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyTermRemoteUITests
