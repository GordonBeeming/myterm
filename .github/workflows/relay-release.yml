name: Relay release packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'release' || github.event.release.tag_name != 'assets'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Services/relay/go.mod
          cache-dependency-path: Services/relay/go.sum
      - name: Test relay
        working-directory: Services/relay
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and verify release archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version=0.0.0
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            [[ "$RELEASE_TAG" == v* ]] || { echo 'Release tag must begin with v' >&2; exit 1; }
            version="${RELEASE_TAG#v}"
          fi
          bash script/package_relay.sh "$version" dist/relay "$TARGET_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-release-${{ matrix.arch }}
          path: dist/relay/*
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'relay-release-*' --dir dist/relay
      - name: Attach relay to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/relay/*/*
