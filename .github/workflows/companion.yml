name: Companion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/companion.yml'
      - 'Companion/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Packages/MyTermRemote/**'
      - 'Services/push-gateway/**'
      - 'Services/relay/**'
      - 'Sources/MyTerm/Companion/**'
      - 'Sources/MyTermCore/**'
      - 'Sources/MyTermPlatform/**'
      - 'Vendor/SwiftTerm/**'
      - 'script/deploy_companion_testflight.sh'
      - 'script/test_companion.sh'
      - 'script/test_companion_testflight_helper.sh'
      - 'script/verify_companion_toolchain.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/companion.yml'
      - 'Companion/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Packages/MyTermRemote/**'
      - 'Services/push-gateway/**'
      - 'Services/relay/**'
      - 'Sources/MyTerm/Companion/**'
      - 'Sources/MyTermCore/**'
      - 'Sources/MyTermPlatform/**'
      - 'Vendor/SwiftTerm/**'
      - 'script/deploy_companion_testflight.sh'
      - 'script/test_companion.sh'
      - 'script/test_companion_testflight_helper.sh'
      - 'script/verify_companion_toolchain.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Services/relay/go.mod
          cache-dependency-path: Services/relay/go.sum
      - name: Test native remote protocol and cryptography
        run: swift test --package-path Packages/MyTermRemote --parallel
      - name: Test TestFlight configuration renderer
        run: bash script/test_companion_testflight_helper.sh

  relay-browser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Services/relay/go.mod
          cache-dependency-path: Services/relay/go.sum
      - name: Install locked browser test dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --prefix Services/relay/tests/browser
      - name: Test relay WebAuthn in headless Chrome
        env:
          MYTERM_RELAY_EVIDENCE_DIR: ${{ runner.temp }}/relay-browser-evidence
        run: npm test --prefix Services/relay/tests/browser
      - name: Preserve relay browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-browser-evidence
          path: ${{ runner.temp }}/relay-browser-evidence
          if-no-files-found: warn

  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [relay, push-gateway]
    defaults:
      run:
        working-directory: Services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Services/${{ matrix.service }}/go.mod
          cache-dependency-path: Services/${{ matrix.service }}/go.sum
      - name: Check service behavior and data races
        run: go test -race ./...
      - name: Vet service
        run: go vet ./...
      - name: Build service
        run: go build ./cmd/...

  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify actual SDK
        run: bash script/verify_companion_toolchain.sh 27.0
      - name: Install the matching Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Test companion on iOS 27
        env:
          COMPANION_DEVICE_FAMILY: ${{ matrix.device }}
        run: bash script/test_companion.sh
      - name: Preserve simulator test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-${{ matrix.device }}-results
          path: dist/companion-${{ matrix.device }}.xcresult
          if-no-files-found: warn

  deploy-beta:
    name: Deploy to TestFlight
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [remote-core, relay-browser, services, ios]
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 90
    environment: beta
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify actual SDK
        run: bash script/verify_companion_toolchain.sh 27.0
      - name: Install the matching Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Archive, validate, and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
          PROVISIONING_PROFILE_NAME: ${{ vars.PROVISIONING_PROFILE_NAME }}
          NOTIFICATION_PROVISIONING_PROFILE_NAME: ${{ vars.NOTIFICATION_PROVISIONING_PROFILE_NAME }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          MYTERM_PUSH_GATEWAY_ORIGIN: ${{ vars.MYTERM_PUSH_GATEWAY_ORIGIN }}
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          NOTIFICATION_PROVISIONING_PROFILE: ${{ secrets.NOTIFICATION_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash script/deploy_companion_testflight.sh
      - name: Preserve exported IPA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyTermCompanion-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/myterm-testflight/export/*.ipa
          if-no-files-found: warn
          retention-days: 90
