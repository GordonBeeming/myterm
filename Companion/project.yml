name: MyTermCompanion
options:
  bundleIdPrefix: com.gordonbeeming.myterm
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Support/Signing.xcconfig
  Release: Support/Signing.xcconfig
packages:
  MyTerm:
    path: ..
  MyTermRemote:
    path: ../Packages/MyTermRemote
  SwiftTerm:
    path: ../Vendor/SwiftTerm
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "$(TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.33"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      MYTERM_COMPANION_BUNDLE_ID: com.gordonbeeming.myterm.companion.dev
      MYTERM_KEYCHAIN_GROUP: com.gordonbeeming.myterm.companion.dev.shared
      MYTERM_APP_GROUP: group.com.gordonbeeming.myterm.companion.dev
      MYTERM_URL_SCHEME: myterm-companion-dev
    Release:
      MYTERM_COMPANION_BUNDLE_ID: com.gordonbeeming.myterm.companion
      MYTERM_KEYCHAIN_GROUP: com.gordonbeeming.myterm.companion.shared
      MYTERM_APP_GROUP: group.com.gordonbeeming.myterm.companion
      MYTERM_URL_SCHEME: myterm-companion
targets:
  MyTermCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Shared
      - path: Support/Assets.xcassets
        buildPhase: resources
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MyTerm
        product: MyTermCore
      - package: MyTermRemote
        product: MyTermRemote
      - package: SwiftTerm
        product: SwiftTerm
      - target: MyTermNotificationService
        embed: true
    info:
      path: Support/MyTermCompanion-Info.plist
      properties:
        CFBundleDisplayName: "$(MYTERM_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSCameraUsageDescription: Scan a MyTerm pairing code from your Mac.
        NSLocalNetworkUsageDescription: Connect to a MyTerm relay hosted on your local network.
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        MyTermKeychainAccessGroup: "$(AppIdentifierPrefix)$(MYTERM_KEYCHAIN_GROUP)"
        MyTermPushGatewayOrigin: "$(MYTERM_PUSH_GATEWAY_ORIGIN)"
        CFBundleURLTypes:
          - CFBundleURLName: MyTerm companion authentication
            CFBundleURLSchemes:
              - "$(MYTERM_URL_SCHEME)"
    entitlements:
      path: Support/MyTermCompanion.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.devicecheck.appattest-environment: "$(APP_ATTEST_ENVIRONMENT)"
        com.apple.security.application-groups:
          - "$(MYTERM_APP_GROUP)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(MYTERM_KEYCHAIN_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MYTERM_COMPANION_BUNDLE_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          MYTERM_DISPLAY_NAME: MyTerm Dev
          APS_ENVIRONMENT: development
          APP_ATTEST_ENVIRONMENT: development
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(MYTERM_APP_PROVISIONING_PROFILE)"
          MYTERM_DISPLAY_NAME: MyTerm
          APS_ENVIRONMENT: production
          APP_ATTEST_ENVIRONMENT: production
  MyTermNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared/NotificationEnvelope.swift
      - path: Shared/AppConfiguration.swift
    dependencies:
      - package: MyTermRemote
        product: MyTermRemote
    info:
      path: Support/MyTermNotificationService-Info.plist
      properties:
        CFBundleDisplayName: MyTerm Notification Service
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
        MyTermKeychainAccessGroup: "$(AppIdentifierPrefix)$(MYTERM_KEYCHAIN_GROUP)"
        MyTermPushGatewayOrigin: "$(MYTERM_PUSH_GATEWAY_ORIGIN)"
    entitlements:
      path: Support/MyTermNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(MYTERM_APP_GROUP)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(MYTERM_KEYCHAIN_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MYTERM_COMPANION_BUNDLE_ID).notifications"
        SKIP_INSTALL: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(MYTERM_NOTIFICATION_PROVISIONING_PROFILE)"
          APS_ENVIRONMENT: production
  MyTermCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MyTermCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gordonbeeming.myterm.companion.tests
  MyTermCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MyTermCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gordonbeeming.myterm.companion.uitests
        TEST_TARGET_NAME: MyTermCompanion
schemes:
  MyTermCompanion:
    build:
      targets:
        MyTermCompanion: all
        MyTermNotificationService: all
        MyTermCompanionTests: [test]
        MyTermCompanionUITests: [test]
    test:
      targets:
        - MyTermCompanionTests
        - MyTermCompanionUITests
      gatherCoverageData: true
